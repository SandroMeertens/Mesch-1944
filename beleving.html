*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--dark);color:var(--ink)}
button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #fff;outline-offset:4px}

.route-list .pick small{display:block;color:#d6c8a8;margin-top:4px}

#panel.open{display:flex}

#close{float:right;border-radius:50%;border:1px solid var(--line);background:#2d4136;color:white;width:38px;height:38px;font-size:23px;line-height:1}
.answer,.pick,.scenechoice{display:block;width:100%;background:#284238;color:#f6e8d1;border:1px solid #b5cdb057;border-radius:9px;padding:12px;margin:9px 0;text-align:left}

#response{margin-top:12px;padding:13px;background:#0f241e;border-left:3px solid var(--gold);border-radius:5px;min-height:30px}

otspots":[{"id":"conflict-meaning","type":"inspect","label":"Wat betekende Duits verzet?","x":58,"y":31,"w":39,"h":49,"marker_x":77.5,"marker_y":55.5,"content":"border35"},{"id":"conflict-soldier","type":"talk","label":"Praat met een soldaat","x":2,"y":43,"w":35,"h":46,"marker_x":19.5,"marker_y":66,"content":"american"},{"id":"conflict-go","type":"enter","label":"Bekijk de nadering vanuit het weiland","x":40,"y":65,"w":29,"h":31,"marker_x":54.5,"marker_y":80.5,"target":"u14"}]},"v8-breul-facade":{"id":"v8-breul-facade","title":"Cafékopgevel — artistieke variant","place":"Bij De Breul","image":"assets/sc-v8-breul-facade.webp","thumb":"assets/th-v8-breul-facade.webp","description":"Dit is een extra beeld bij het verhaal van Mesch. De personages en architectonische details zijn artistiek ingevuld.","prompt":"Waar kwamen de Amerikaanse soldaten vandaan?","tip":"De nadering door het weiland en de heg is historisch beschreven.","status":"EXTRA SCHILDERPLAAT · CONCEPT","hotspots":[{"id":"facade-unknown","type":"inspect","label":"Hoe zeker is deze cafégevel?","x":35,"y":8,"w":44,"h":55,"marker_x":57,"marker_y":35.5,"content":"cafe_facade"},{"id":"facade-meadow","type":"enter","label":"Bekijk de eerdere nadering als verhaal","x":9,"y":49,"w":35,"h":43,"marker_x":26.5,"marker_y":70.5,"target":"u14"}]},"v8-cafe-other":{"id":"v8-cafe-other","title":"Café Van Hoven — andere gevelinterpretatie","place":"Omgeving café","image":"assets/sc-v8-cafe-other.webp","thumb":"assets/th-v8-cafe-other.webp","description":"Dit is een extra beeld bij het verhaal van Mesch. De personages en architectonische details zijn artistiek ingevuld.","prompt":"Waarom was dit gebouw zo belangrijk?","tip":"De functie als tijdelijk Duits lazaret is bekend; de precieze gevel niet.","status":"EXTRA SCHILDERPLAAT · CONCEPT","hotspots":[{"id":"other-cafe","type":"inspect","label":"Historische functie van Café Van Hoven","x":5,"y":20,"w":44,"h":44,"marker_x":27,"marker_y":42,"content":"cafe_facade"},{"id":"other-us","type":"talk","label":"Spreek een Amerikaan","x":38,"y":50,"w":30,"h":37,"marker_x":53,"marker_y":68.5,"content":"american"},{"id":"other-cafe-entrance","type":"enter","label":"Kijk binnen in het café","x":5,"y":35,"w":24,"h":35,"marker_x":17,"marker_y":52.5,"target":"u08"}]},"german-detail":{"id":"german-detail","title":"De Duitse soldaat — een moment van overgave","place":"Grijzegraaf · detailbeeld","image":"assets/sc-german-detail.webp","thumb":"assets/th-german-detail.webp","description":"De soldaat is moe en houdt zijn handen zichtbaar omhoog. Hij weet niet wat er gaat gebeuren. Dit is een artistiek detailbeeld uit plaat 16, geen portret van een geïdentificeerde historische persoon.","prompt":"Wat betekent het om je over te geven?","tip":"Dit is een detailbeeld. Klik op de knop in het schilderij om terug te keren naar de overgave.","status":"DETAILUITSNede UIT NIEUWE PLAAT 16 · ARTISTIEK","hotspots":[{"id":"german-detail-back","type":"move","target":"gg2-w","label":"Terug naar plaat 16","x":1,"y":77,"w":27,"h":22},{"id":"german-detail-info","type":"inspect","content":"surrender","label":"Wat is overgave?","x":31,"y":18,"w":60,"h":67}]}},"PEOPLE":{"warnier":{"name":"Jef Warnier","status":"historische persoon · nagespeelde dialoog","intro":"Schoolhoofd Warnier beschreef hoe hij bij de Grijzegraaf een Duitse soldaat met opgeheven handen zag en Amerikaanse militairen ontmoette.","qa":[["Waarom was u eerder in de kelder?","Er werd in de omgeving geschoten. Bewoners zochten dekking. In zijn verslag beschreef Warnier de angst en onzekerheid van die ochtend."],["Wat zag u buiten?","Volgens zijn relaas zag Warnier een Duitse soldaat die zich overgaf en een Amerikaanse militair."],["Was heel Nederland toen vrij?","Nee. Mesch behoorde tot de eerste bevrijde plaatsen, maar voor veel andere inwoners van Nederland zou de bezetting nog maanden duren."]],"source":"Stichting Eijsdens Verleden · De bevrijding van Eijsden-Margraten"},"german":{"name":"De overgevende Duitse soldaat","status":"samengesteld personage · uitleg, geen authentieke uitspraken","intro":"De overgave van een Duitse soldaat is historisch beschreven. Zijn identiteit, precieze gedachten en woorden zijn hier niet vastgesteld.","qa":[["Waarom zijn zijn handen omhoog?","Dat is een duidelijk teken van overgave: hij laat zien dat hij niet verder vecht."],["Wat gebeurde er met soldaten die zich overgaven?","Ze konden krijgsgevangen worden genomen. Ze mochten niet zomaar opnieuw deelnemen aan het gevecht."],["Weten we wat deze soldaat dacht?","Nee. Uitputting en angst zijn plausibele artistieke interpretaties, geen letterlijk bekende gevoelens van deze persoon."]],"source":"Ooggetuigenverslag Jef Warnier, via Stichting Eijsdens Verleden"},"american":{"name":"Amerikaanse infanterist","status":"samengesteld personage · nagespeelde dialoog","intro":"Soldaten van het 117e regiment, 30e Amerikaanse Infanteriedivisie, bereikten op 12 september 1944 Nederland.","qa":[["Waar kwamen de Amerikanen vandaan?","Ze waren via België naar de Nederlandse grens bij Mesch opgerukt."],["Waarom bleven ze voorzichtig?","In de omgeving waren nog Duitse militairen en werd geschoten. De situatie kon snel veranderen."],["Wie sneuvelde bij de grens?","Leonard J. Hoffman, een Amerikaan uit Pennsylvania, kwam tijdens de gevechten bij grenspaal 35 om het leven."]],"source":"NIMH en informatiebord Leonard Hoffman"},"medic":{"name":"Militaire hulpverlener — samengesteld personage","intro":"Deze man is een educatief samengesteld personage, geen geïdentificeerde historische persoon. Hij helpt uitleggen hoe een geïmproviseerd lazaret werkte.","status":"Fictieve gids bij een gedocumenteerde medische functie","source":"Getuigenissen Café Van Hoven en algemene historische context","qa":[["Waarom lag hier verband?","De gewonden moesten worden verbonden en verzorgd. Een café had daarvoor niet alle voorzieningen van een ziekenhuis."],["Was het veilig?","Niet helemaal. Ook in een noodhulppost was de oorlog dichtbij."],["Waren alle gewonden Duitse soldaten?","Wie hier precies op welk moment werd verzorgd, kunnen we uit deze afbeelding niet vaststellen."]]},"resident":{"name":"Bewoner van Mesch — samengesteld personage","intro":"Dit is een fictieve dorpsbewoner die laat zien hoe schuilen tijdens de bevrijding kon aanvoelen.","status":"Fictieve dialoog, historisch plausibele ervaring","source":"Herinneringen aan het schuilen in Mesch","qa":[["Waarom zat u hier?","Buiten hoorden we schoten en we wisten niet waar het gevaar vandaan kwam."],["Wist u dat de Amerikanen kwamen?","We hoopten op bevrijding, maar konden vanuit de kelder niet zien wat er op straat gebeurde."],["Wat gebeurde er later?","Pas toen het veiliger werd, durfden mensen weer naar buiten."]]}},"TOPICS":{"hedge":{"title":"De heg en de eerste Amerikanen","body":"In de historische beschrijvingen komen Amerikaanse militairen vanuit het weiland en door de heg richting Grijzegraaf. De precieze stapplaats en het uiterlijk van de heg zijn niet overal in beeldmateriaal bewezen. Een echte wandelroute mag daarom niet zomaar door een gesloten heg worden getekend.","status":"historische gebeurtenis + artistieke ligging","source":"Stichting Eijsdens Verleden"},"meadow":{"title":"Vanuit het weiland","body":"De nadering van Amerikaanse infanteristen vanuit het veld is historisch beschreven. De aantallen, houdingen en individuele gezichten op deze plaat zijn artistiek gereconstrueerd.","status":"feit + interpretatie","source":"Stichting Eijsdens Verleden"},"lazaret":{"title":"Café als tijdelijk Duits lazaret","body":"Café Van Hoven was tijdens de gevechten als Duits noodhospitaal ingericht. Later werd beschreven dat er veel verbandmateriaal en sporen van de gewondenzorg achterbleven. De exacte ruimte-indeling en afgebeelde medici zijn niet door de afbeelding bewezen.","status":"historische functie, artistiek interieur","source":"Stichting Eijsdens Verleden; getuigenissen van de familie Van Hoven"},"camera_unknown":{"title":"Waarom is dit nog een maquette?","body":"Het onderleggerbeeld laat ons de vaste bouwmassa, weg en horizon zien. De werkelijke ramen, gevelafwerking en gedetailleerde 1944-inrichting zijn nog niet allemaal vastgesteld. De exacte camera-RD-gegevens van dit standpunt zijn evenmin meegeleverd.","status":"geometrische bron, historische aankleding open","source":"Aangeleverde 3D-onderlegger"},"border35":{"title":"De grensoversteek bij Mesch","body":"Soldaten van het Amerikaanse 117e Infanterieregiment, 30e Infanteriedivisie, bereikten op 12 september 1944 bij Mesch de Nederlandse grens. Voor de inwoners van dit dorp begon de bevrijding eerder dan voor veel andere Nederlanders. Dit is een uitleg over een eerdere gebeurtenis, niet iets wat je op de huidige plek letterlijk ziet.","status":"historisch gebeurtenisoverzicht · geen tijdsprong","source":"NIMH: We are now fighting in Holland; Stichting Eijsdens Verleden"},"shelter":{"title":"Waarom inwoners in kelders schuilden","body":"Tijdens de gevechten zochten inwoners bescherming in kelders. Jef Warnier beschreef de angst en onzekerheid, het geweervuur en de stilte die later viel. De ingerichte schuilkelderplaat moet nog worden geproduceerd. Dit is brongebonden uitleg, geen live-scène in deze kamer.","status":"ooggetuigencontext · interieur nog niet beschikbaar","source":"Jef Warnier, De bevrijding van Eijsden-Margraten (Stichting Eijsdens Verleden)"},"hoffman":{"title":"Leonard J. Hoffman — de menselijke prijs","body":"Leonard J. Hoffman was een Amerikaanse soldaat die bij de grensgevechten om het leven kwam. Zijn verhaal herinnert eraan dat bevrijding ook offers kostte. De app toont hem niet alsof hij bij de latere overgave aanwezig was.","status":"historisch persoon · herdenking, geen reconstructie van overlijden","source":"Stichting Eijsdens Verleden, informatiebord Leonard Hoffman"},"school":{"title":"De oude school van Mesch","body":"De oorspronkelijke 3D-onderlegger laat aan de Grijzegraaf het schoolgebouw zien: wit gepleisterd, twee bouwlagen, een steil zadeldak en één rond venster hoog in de kopgevel. Dit is de herkenningsinformatie uit het reconstructiedossier. Een exacte raam- en deurindeling op andere gevels is hiermee niet bewezen. De school is belangrijk in het verhaal van schoolhoofd Jef Warnier.","status":"reconstructiedossier · geveldetails gedeeltelijk bekend","source":"Gebruikersdossier oude school, foto 7097 (nog afzonderlijk te verifiëren)"},"road":{"title":"De Grijzegraaf als wandelroute","body":"De ligging en het perspectief van de straat komen uit de 3D-onderlegger. De precieze historische wegverharding is nog onzeker. Daarom mag het schilderij de weg sfeervol maar onopvallend tonen. Er is geen gemeten route van deze camera naar GG3-W beschikbaar.","status":"maquette als bron · route nog niet geijkt","source":"GG1-O onderlegger en cameraplan"},"cafe_facade":{"title":"Café Van Hoven: waar zaten de ramen?","body":"Café Van Hoven stond aan de Grijzegraaf en werd tijdens de gevechten gebruikt als tijdelijk lazaret. De ramen, de voordeur en het uithangbord op deze artistieke versie van de kopgevel zijn niet bevestigd voor 1944. Je kunt ernaar kijken, maar dit is nog geen historisch geverifieerde deur om echt doorheen te lopen.","status":"historische functie bevestigd · architectonische aankleding artistiek","source":"Stichting Eijsdens Verleden en BR1-ZW reconstructiedossier"},"classroom":{"title":"Het oude klaslokaal","body":"Onderwijzen en leren gingen tijdens de bezetting niet vanzelfsprekend door. De oude school van Mesch is een herkenbare plek in de verhalen over schoolhoofd Jef Warnier. De precieze schoolbanken, kaarten, ramen en inrichting op dit schilderij zijn artistiek ingevuld.","status":"Artistiek interieur met historische context","source":"Projectdossier oude school en herinneringen aan Jef Warnier"},"family":{"title":"Leven in een schoolwoning","body":"Gezinnen probeerden tijdens de bezetting zo gewoon mogelijk te leven. Op de dag van de bevrijding zochten bewoners beschutting. Deze schildering toont een mogelijke woonkamer en geen fotografisch bewezen interieur.","status":"Plausibele reconstructie","source":"Historische publicatie over de bevrijding van Eijsden-Margraten"},"cafe_room":{"title":"Het café als ontmoetingsplaats","body":"Café Van Hoven was vóór de bevrijding een vertrouwde plek voor bewoners. Tijdens de gevechten moest het ook dienen als tijdelijk lazaret. De meubels, deuren en aankleding van dit vertrek zijn artistiek gereconstrueerd.","status":"Historische functie; onzekere inrichting","source":"Stichting Eijsdens Verleden"},"supplies":{"title":"De voorraadkelder","body":"Een kelder was in het dagelijks leven een plek om levensmiddelen en andere voorraad te bewaren. De afbeelding is een artistieke voorstelling en bewijst niet welke voorraad de familie Van Hoven werkelijk had.","status":"Artistieke verdieping","source":"Historische context, niet specifiek gedocumenteerd voor deze kelder"},"liberation":{"title":"De betekenis van de bevrijding","body":"Amerikaanse militairen trokken op 12 september 1944 Mesch binnen. De opluchting groeide toen duidelijker werd dat de Duitsers weg waren. Dat eerste contact betekende nog niet dat heel Nederland bevrijd was.","status":"Historische kern met artistiek onthaal","source":"NIMH en Stichting Eijsdens Verleden"},"paintings":{"title":"Historische schilderijen en de echte gebeurtenissen","status":"artistiek beeld, historisch verhaal","body":"De beelden zijn gemaakt om het verhaal van de bevrijding te beleven. De ligging van de school, het café en de Grijzegraaf is gebaseerd op beschikbare reconstructies; veel ramen, kleding, voorwerpen en gezichtsuitdrukkingen zijn verzonnen. Sommige kijkplaten tonen herinneringen uit de ochtend of de latere middag. Je verandert daarmee niet letterlijk van tijd.","source":"Mesch 1944 · ontwerp- en historisch dossier"}},"NAV_NODES":[["u01","De nadering","Ochtend"],["u14","De Amerikanen komen dichterbij","Ochtend"],["gg3-w","De eerste on const normalizeQuestion=value=>String(value||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function findGroundedAnswer(id,input){
 const p=PEOPLE[id],q=normalizeQuestion(input);
 if(!p||!q)return null;
 const exact=p.qa.find(([question])=>normalizeQuestion(question)===q);
 if(exact)return exact[1];
 // Het prototype koppelt vragen alleen aan vooraf geschreven antwoorden.
 const patterns=QUESTION_PATTERNS[id]||[];
 const specificity=patterns.map((rx,i)=>({i,match:rx.exec(q)})).filter(x=>x.match);
 if(specificity.length===1)return p.qa[specificity[0].i]?.[1]||null;
 if(specificity.length>1){
  // Een ambigue vraag niet aan een willekeurig antwoord koppelen.
  return null;
 }
 // Vergelijk alleen voldoende specifieke begrippen met de voorbeeldvragen.
 const words=x=>x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').match(/[a-z]{4,}/g)||[];
 const common=new Set(['waarom','welke','waren','heeft','hebt','jullie','deze','daar','hier','alleen','meer','kunt','konden','worden','werd','toen','sommige','gebeurde']);
 const toks=words(q).filter(x=>!common.has(x));
 let scored=(p.qa||[]).map(([question,answer],i)=>({i,score:words(question).filter(t=>!common.has(t)&&toks.some(w=>w===t)).length}));
 scored.sort((a,b)=>b.score-a.score);
 return scored.length&&scored[0].score>=2&&(!scored[1]||scored[0].score>scored[1].score)?p.qa[scored[0].i][1]:null;
}

  <aside id="personChat" class="person-main" aria-labelledby="chatHeading" hidden>
   <h2 id="chatHeading" tabindex="-1">Stel je vraag</h2>
   <p class="person-status">${esc(person.role||'Gereconstrueerd gesprek')}</p>
   <p>${esc(person.intro||'')}</p>
   <form id="questionForm">
    <input id="freeQuestion" type="text" maxlength="180" autocomplete="off" placeholder="Typ je vraag" aria-label="Stel zelf een historische vraag">
    <button type="submit" id="askButton">Vraag</button>
   </form>
   <div id="chatHistory" role="log" aria-live="polite" aria-label="Gesprek"></div>
   <h2>Voorbeeldvragen</h2>
   <div id="q"></div>
   <details><summary>Bron van dit gesprek</summary><p>De antwoorden komen uit vooraf geschreven gespreksteksten. Bron: ${sourceLink}</p></details>
  </aside>`;
 $('walk').hidden=true;
 $('walkTools').hidden=true;
 $('conversationTools').hidden=false;
 $('conversation').hidden=false;
 showChat(true);
 document.title=$('personName').textContent+' | Mesch 1944';
 $('personName').focus();
 const image=$('personContent').querySelector('.person-figure img');
 image?.addEventListener('error',()=>{
  const notice=document.createElement('div');
  notice.className='missing-portrait';
  notice.textContent='Het portret kon niet worden geladen.';
  image.closest('picture').replaceWith(notice);
 },{once:true});
 const history=$('chatHistory');
 function appendTurn(kind,txt,label){
  const div=document.createElement('div');div.className='chat-turn '+kind;
  const small=document.createElement('small');small.textContent=label;div.appendChild(small);
  const span=document.createElement('span');span.textContent=txt;div.appendChild(span);
  history.appendChild(div);history.scrollTop=history.scrollHeight;
 }
 function showTurn({question,answer}){
  appendTurn('question',question,'Jij');
  appendTurn('answer',answer||'Daar weet ik geen zeker antwoord op. Kies een voorbeeldvraag of vraag iets over wat je op de plaat ziet.',answer?person.name:'Geen antwoord beschikbaar');
 }
 function reply(question,answer){
  const turn={question,answer};
  turns.push(turn);
  showTurn(turn);
 }
 turns.forEach(showTurn);
 $('questionForm').addEventListener('submit',e=>{
  e.preventDefault();const inp=$('freeQuestion'),v=inp.value.trim();
  if(!v)return;
  reply(v,findGroundedAnswer(id,v));inp.value='';inp.focus();
 });
 (person.qa||[]).forEach(([q,a])=>{const b=document.createElement('button');b.className='answer';b.type='button';b.textContent=q;b.onclick=()=>reply(q,a);$('q').appendChild(b)});
}
